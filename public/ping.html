<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, 
initial-scale=1.0" />
  <title>Ping 命令模拟</title>
  <!-- 引入 animate.js 库 -->
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/aimate.css/4.1.1/animate.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f5f5f5;
    }
    .ping-container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
      transition: all 0.5s ease;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .failure {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="ping-container">
    <h2>模拟 Ping 命令</h2>
    <input type="text" id="ipInput" placeholder="输入目
标 IP 地址（如 8.8.8.8）" />
    <button onclick="simulatePing()">执行 
Ping</button>
    <div id="result" class="result 
animate__animated animate__fadeIn"></div>
  </div>

  <script>
    function simulatePing() {
      const ip = 
document.getElementById("ipInput").value.trim();
      const resultDiv = 
document.getElementById("result");

      if (!ip) {
        resultDiv.textContent = "请输入有效的 IP 地址！";
        resultDiv.className = "result animate__animated animate__shake";
        return;
      }

      // 模拟 ping 结果（随机数据）
      const delay = Math.floor(Math.random() * 200) + 
50; // 50~200ms
      const responseTime = Math.floor(Math.random() * 
100) + 20; // 20~100ms
      const packetLoss = Math.floor(Math.random() * 
10); // 0~10%

      // 动画效果：淡入 + 滑动
      resultDiv.className = "result animate__animated animate__fadeInUp";
      resultDiv.innerHTML = `
        <p><strong>目标 IP:</strong> ${ip}</p>
        <p><strong>延迟:</strong> ${delay}ms</p>
        <p><strong>响应时间:</strong> 
${responseTime}ms</p>
        <p><strong>丢包率:</strong> ${packetLoss}%</p>
      `;
    }
  </script>
</body>
</html>
